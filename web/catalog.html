<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogio — Мой каталог</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">
        <a href="/catalog" class="logo">Catalogio</a>

        <div class="navbar-actions">
            <span id="user-email" class="user-email"></span>

            <button
                id="logout-button"
                class="button button-secondary"
            >
                Выйти
            </button>
        </div>
    </div>
</header>

<main class="container">

    <section class="page-header">
        <div>
            <h1>Мой каталог</h1>
            <p class="subtitle">
                Фильмы, сериалы, книги, игры и всё остальное.
            </p>
        </div>

        <button
            id="add-item-button"
            class="button button-primary"
        >
            + Добавить
        </button>
    </section>

    <section class="toolbar">
        <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Поиск по названию..."
        >

        <select id="type-filter">
            <option value="">Все типы</option>
        </select>

        <select id="status-filter">
            <option value="">Все статусы</option>
        </select>
    </section>

    <p id="error-message" class="error-message"></p>

    <section id="items-list" class="items-grid">
    </section>

    <p id="empty-message" class="empty-message hidden">
        В каталоге пока ничего нет.
    </p>

</main>

<div id="item-modal" class="modal hidden">
    <div class="modal-overlay"></div>

    <section class="modal-card">
        <div class="modal-header">
            <h2 id="modal-title">Добавить в каталог</h2>

            <button
                id="close-modal-button"
                class="modal-close"
                type="button"
            >
                ×
            </button>
        </div>

        <form id="item-form" class="item-form">

            <input
                id="item-id"
                type="hidden"
            >

            <label for="item-title">Название</label>
            <input
                id="item-title"
                type="text"
                placeholder="Введите название..."
                required
            >

            <label for="item-description">Описание</label>
            <textarea
                id="item-description"
                rows="3"
                placeholder="Краткое описание..."
            ></textarea>

            <div class="form-row">
                <div class="form-field">
                    <div class="field-header">
                        <label for="item-type">Тип</label>
                        <div>
                            <button type="button" id="add-type-button" 
                            class="button-icon-add" title="Добавить свой тип">
                                +
                            </button>
                            <button type="button" id="manage-types-button" 
                            class="button-icon-add" title="Управление типами">
                                ⚙
                            </button>
                        </div>
                    </div>
                    
                    <select id="item-type">
                        <option value="">Без типа</option>
                    </select>
                </div>

                <div class="form-field">
                    <div class="field-header">
                        <label for="item-status">Статус</label>
                        <div>
                            <button type="button" id="add-status-button" 
                            class="button-icon-add" title="Добавить свой статус">
                                +
                            </button>
                            <button type="button" id="manage-statuses-button" 
                            class="button-icon-add" title="Управление статусами">
                                ⚙
                            </button>
                        </div>
                    </div>
                    <select id="item-status">
                        <option value="">Без статуса</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="item-rating">Оценка</label>

                    <input
                        id="item-rating"
                        type="number"
                        min="0"
                        max="10"
                        step="0.1"
                        placeholder="0–10"
                    >
                </div>

            </div>

            <label for="item-notes">Заметки</label>

            <textarea
                id="item-notes"
                rows="4"
                placeholder="Твои мысли..."
            ></textarea>

            <div class="modal-actions">
                <button
                    type="button"
                    id="cancel-button"
                    class="button button-secondary"
                >
                    Отмена
                </button>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Сохранить
                </button>
            </div>

        </form>
    </section>
</div>

<div id="manage-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <section class="modal-card">
        <div class="modal-header">
            <h2 id="manage-modal-title">Управление</h2>
            <button id="close-manage-modal-button" class="modal-close" type="button">
                ×
            </button>
        </div>

        <ul id="manage-items-list" class="manage-list"></ul>
    </section>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/items.js"></script>

</body>
</html>
