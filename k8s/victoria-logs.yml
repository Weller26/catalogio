apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-pvc
  namespace: catalogio
spec:
  resources:
    requests:
      storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: catalogio
  labels:
    app: victoria-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          args:
            - "-storageDataPath=/vlogs-data"
            - "-retentionPeriod=7d"
            - "-httpListenAddr=:9428"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
          ports:
            - name: http
              containerPort: 9428
          volumeMounts:
            - name: vlogs-storage
              mountPath: /vlogs-data
      volumes:
        - name: vlogs-storage
          persistentVolumeClaim:
            claimName: victoria-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: catalogio
spec:
  type: NodePort
  selector:
    app: victoria-logs
  ports:
  - name: http
    port: 9428
    targetPort: 9428
    nodePort: 30428