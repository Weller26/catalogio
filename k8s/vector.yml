apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: catalogio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-catalogio
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-catalogio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-catalogio
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: catalogio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: catalogio
data:
  vector.yaml: |
    data_dir: /var/lib/vector
    
    sources:
      kubernetes_logs:
        type: kubernetes_logs
    
    transforms:
      filter_catalogio:
        type: filter
        inputs:
          - kubernetes_logs
        condition: '.kubernetes.pod_namespace == "catalogio" && .kubernetes.container_name == "catalogio"'
      
      parse_json:
        type: remap
        inputs:
          - filter_catalogio
        source: |
          .pod_name = .kubernetes.pod_name
          del(.kubernetes)
          del(.file)
          parsed, err = parse_json(string(.message) ?? "")
          if err == null && is_object(parsed) {
            ., err = merge(., parsed)
          }

    sinks:
      victoria_logs:
        type: http
        inputs:
          - parse_json
        
        uri: "http://victoria-logs.catalogio.svc.cluster.local:9428/insert/jsonline?_stream_fields=stream,pod_name&_msg_field=message&_time_field=timestamp"
        encoding:
          codec: json
        framing:
          method: newline_delimited
        healthcheck:
          enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: catalogio
  labels:
    app: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.59.0-alpine
          args:
            - "--config"
            - "/etc/vector/vector.yaml"
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: var-log-pods
              mountPath: /var/log/pods
              readOnly: true
            - name: var-log-containers
              mountPath: /var/log/containers
              readOnly: true
            - name: vector-data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: var-log-pods
          hostPath:
            path: /var/log/pods
        - name: var-log-containers
          hostPath:
            path: /var/log/containers
        - name: vector-data
          hostPath:
            path: /var/lib/vector