apiVersion: batch/v1
kind: Job
metadata:
  name: catalogio-migrate
  namespace: catalogio
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:v4.18.1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command: 
            - "/bin/sh"
            - "-c"
            - |
              /migrate -path /migrations -database 
              "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:
              ${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}" up
          envFrom:
            - configMapRef:
                name: catalogio-config
            - secretRef:
                name: catalogio-secrets
          volumeMounts:
            - name: migration-volume
              mountPath: /migrations
      volumes:
        - name: migration-volume
          configMap:
            name: migrations-files