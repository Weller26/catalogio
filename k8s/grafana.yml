apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: catalogio
  labels:
    app: catalogio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        env:
          - name: GF_INSTALL_PLUGINS
            value: "victoriametrics-logs-datasource"
          - name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: catalogio-secrets
                key: GRAFANA_ADMIN_PASSWORD
        resources:
          limits:
            memory: 512Mi
            cpu: "1"
          requests:
            memory: 256Mi
            cpu: 200m
        ports:
          - name: http
            containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: catalogio
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30090